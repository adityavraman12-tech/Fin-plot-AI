services:
  - type: web
    name: finpilot-integrated-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FINPILOT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://finplot-ai.vercel.app
